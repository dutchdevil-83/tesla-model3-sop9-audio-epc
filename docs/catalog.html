<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tesla Model 3 Highland SOP9 Audio EPC</title>
  <style>
    html,body{height:100%;margin:0;background:#0b1220;color:#e5e7eb;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    main{max-width:760px;margin:10vh auto;padding:24px}
    a{color:#93c5fd}
    .error{display:none;border:1px solid #7f1d1d;background:#2a1115;padding:18px;border-radius:12px}
  </style>
</head>
<body>
<main id="status">
  <h1>Loading interactive EPC…</h1>
  <p>The catalog is loaded from the validated self-contained HTML stored on the repository's <code>main</code> branch.</p>
  <div id="error" class="error">
    <strong>Catalog could not be loaded.</strong>
    <p><a href="https://github.com/dutchdevil-83/tesla-model3-sop9-audio-epc/blob/main/Tesla_SOP9_Audio_EPC_Playground_v2.1.0_Final.html">Open the catalog source on GitHub</a>.</p>
  </div>
</main>
<script>
(async()=>{
  const url='https://raw.githubusercontent.com/dutchdevil-83/tesla-model3-sop9-audio-epc/main/Tesla_SOP9_Audio_EPC_Playground_v2.1.0_Final.html';
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const html=await r.text();
    if(!html.includes('renderInspector')||!html.includes('renderView')) throw new Error('Renderer validation failed');
    document.open(); document.write(html); document.close();
  }catch(e){
    document.querySelector('#status h1').textContent='Interactive EPC unavailable';
    document.querySelector('#error').style.display='block';
    console.error(e);
  }
})();
</script>
</body>
</html>
